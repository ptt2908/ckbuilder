name: Frontend CI

on:
  push:
    paths:
      - "week-06/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "week-06/frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: week-06/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: week-06/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit and integration tests
        run: npm test

      - name: Run TypeScript typecheck
        run: npx tsc -b

      - name: Run production build
        run: npm run build
